defaultPassword: ""
submitter: George Hay
submission: ""
releaseNotes: "Dashboard: see how you compare with men your age (VO2 max, resting heart rate, steps, sleep, blood pressure, BMI and fat mass index), with the published source for every figure. Also: a documents store for reports such as your DNA medication report."
